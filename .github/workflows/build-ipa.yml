name: Compile iOS IPA (macOS Xcode Build)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-ipa:
    name: Build Unity iOS Binary with Xcode
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Exported Xcode Project
        run: |
          echo "== Downloading exported Xcode project from release..."
          gh release download v1.0.0-xcode -p "xcode-project.tar.gz" -R k3ldon/Lro3-iOS
          tar -xzf xcode-project.tar.gz
          ls -la xcode/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Xcode Archive with Clang / LLVM
        run: |
          cd xcode
          mkdir -p Il2CppOutputProject/Source/il2cppOutput
          [ -f Il2CppOutputProject/Source/il2cppOutput/dummy.cpp ] || echo "// IL2CPP dummy" > Il2CppOutputProject/Source/il2cppOutput/dummy.cpp
          echo "== Compiling Unity-iPhone with xcodebuild..."
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath ../build/Lro3.xcarchive

      - name: Package Payload and IPA
        run: |
          echo "== Assembling IPA payload..."
          mkdir -p Payload
          cp -r build/Lro3.xcarchive/Products/Applications/*.app Payload/
          zip -r9 Lro3-iOS.ipa Payload/
          ls -lh Lro3-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lro3-iOS-IPA
          path: Lro3-iOS.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ipa
          name: "Lagnarok RO3 iOS Client v1.0.0"
          files: Lro3-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
