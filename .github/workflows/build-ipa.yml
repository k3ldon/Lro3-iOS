name: Compile iOS IPA (Xcode)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  build-ipa:
    name: Build IPA with Xcode
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Exported Xcode Project
        run: |
          gh release download v1.3.2-xcode -R k3ldon/Lro3-iOS -p xcode-project.tar.gz -O xcode-project.tar.gz
          mkdir -p xcode
          tar -xzf xcode-project.tar.gz -C xcode
          ls xcode/ | head -n 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Xcode Archive with Clang / LLVM
        run: |
          cd xcode
          mkdir -p Il2CppOutputProject/Source/il2cppOutput
          [ -f Il2CppOutputProject/Source/il2cppOutput/dummy.cpp ] || echo "// IL2CPP dummy" > Il2CppOutputProject/Source/il2cppOutput/dummy.cpp

          echo "== Creating PrivacyInfo.xcprivacy..."
          mkdir -p UnityFramework
          cat << 'EOF' > UnityFramework/PrivacyInfo.xcprivacy
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array/>
          </dict>
          </plist>
          EOF
          cp UnityFramework/PrivacyInfo.xcprivacy .

          echo "== Compiling Unity-iPhone with xcodebuild..."
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath ../build/Lro3.xcarchive

      - name: Package Payload and IPA
        run: |
          echo "== Assembling IPA payload with Concept 1 UI..."
          mkdir -p Payload
          cp -r build/Lro3.xcarchive/Products/Applications/*.app Payload/
          APP_DIR=$(ls -d Payload/*.app | head -n 1)

          echo "== Compiling Concept 1 Cocoa Touch Launcher into $APP_DIR..."
          ISYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot $ISYSROOT -miphoneos-version-min=14.0 -fobjc-arc \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -Wl,-rpath,@executable_path/Frameworks \
            native/launcher/main.m native/stubs/stubs_ios.c -o "$APP_DIR/LagnarokRO3"

          echo "== Injecting Launcher Assets (bg.jpg, logo-hero.png)..."
          mkdir -p "$APP_DIR/assets"
          cp native/launcher/assets/bg.jpg "$APP_DIR/assets/"
          cp native/launcher/assets/logo-hero.png "$APP_DIR/assets/"

          zip -r9 Lro3-iOS.ipa Payload/
          ls -lh Lro3-iOS.ipa

      - name: E2E Structural Validation of IPA
        run: |
          echo "== Unpacking IPA for structural E2E =="
          rm -rf ipa-check && mkdir ipa-check
          unzip -q Lro3-iOS.ipa -d ipa-check
          APP_DIR=$(ls -d ipa-check/Payload/*.app | head -n 1)
          echo "App bundle: $APP_DIR"

          FAIL=0
          fail() { echo "::error::$1"; FAIL=1; }

          echo "== 1. Launcher executable present and arm64 =="
          LAUNCHER="$APP_DIR/LagnarokRO3"
          [ -f "$LAUNCHER" ] || fail "launcher executable missing"
          if [ -f "$LAUNCHER" ]; then
            lipo -info "$LAUNCHER" | grep -q arm64 || fail "launcher not arm64"
            lipo -info "$LAUNCHER"
          fi

          echo "== 2. UnityFramework present with arm64 slice =="
          UFW="$APP_DIR/Frameworks/UnityFramework.framework/UnityFramework"
          if [ -f "$UFW" ]; then
            lipo -info "$UFW" | grep -q arm64 || fail "UnityFramework not arm64"
            lipo -info "$UFW"
          else
            echo "::warning::UnityFramework binary not found at expected path"
            ls -la "$APP_DIR/Frameworks/" 2>/dev/null || echo "no Frameworks dir"
          fi

          echo "== 3. Game Data folder with UnityFS bundles (RO3V 24-byte header tolerated) =="
          DATA="$APP_DIR/Data"
          [ -d "$DATA" ] || fail "Data folder missing"
          for f in globalgamemanagers.assets sharedassets0.assets level0; do
            [ -f "$DATA/$f" ] || fail "Data/$f missing"
          done
          echo "Core Data files present."

          echo "== 4. UnityFS magic and platform byte retargeted to iOS (9) =="
          python3 - "$DATA" << 'PYEOF'
          import sys, struct, glob, os

          data_dir = sys.argv[1]
          REQUIRED = ['globalgamemanagers.assets', 'sharedassets0.assets', 'level0']
          VER = b'2022.3.62f3\x00'

          def load_bundle(path):
              with open(path, 'rb') as f:
                  raw = f.read()
              off = 0
              if raw[:4] == b'RO3V':
                  off = 24
              return raw[off:], off

          fails = []
          retargeted = 0
          for name in REQUIRED:
              path = os.path.join(data_dir, name)
              data, off = load_bundle(path)
              if data[:7] != b'UnityFS':
                  fails.append(f'{name}: no UnityFS magic (header offset {off})')
                  continue
              # platform byte follows the second version string in the archive header
              idx = data.find(VER)
              found = False
              while idx != -1:
                  p = idx + len(VER)
                  if p < len(data):
                      val = data[p]
                      if val == 9:
                          retargeted += 1
                          found = True
                          break
                      elif val == 19:
                          fails.append(f'{name}: platform byte still 19 (Windows) - not retargeted')
                          found = True
                          break
                  idx = data.find(VER, idx + 1)
              if not found:
                  # Some Unity variants omit the platform byte in the header scan range;
                  # treat as warning unless another platform id is clearly present.
                  print(f'  [warn] {name}: platform byte not found near Unity version string')

          if fails:
              for m in fails:
                  print(f'  [error] {m}')
              sys.exit(1)
          print(f'UnityFS magic OK; platform byte iOS(9) verified on {retargeted}/{len(REQUIRED)} core bundles')
          PYEOF

          echo "== 5. Info.plist and assets =="
          [ -f "$APP_DIR/Info.plist" ] || fail "Info.plist missing"
          [ -f "$APP_DIR/assets/bg.jpg" ] || fail "bg.jpg missing"
          [ -f "$APP_DIR/assets/logo-hero.png" ] || fail "logo-hero.png missing"
          plutil -lint "$APP_DIR/Info.plist" || fail "Info.plist invalid"

          echo "== 6. Mach-O load commands sane (minos >= 14.0) =="
          vtool -show-build "$LAUNCHER" 2>/dev/null | grep -E 'platform|minos' || echo "(vtool no output)"

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "IPA structural E2E: all assertions green."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lro3-iOS-IPA
          path: Lro3-iOS.ipa
          retention-days: 14

  trigger-e2e:
    name: Trigger E2E Simulator Gate
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run E2E workflow and wait
        run: |
          echo "IPA built. Running E2E simulator gate..."
          gh workflow run "E2E iOS Simulator" -R k3ldon/Lro3-iOS --ref main
          sleep 20
          RUN_ID=$(gh run list -R k3ldon/Lro3-iOS --workflow 'E2E iOS Simulator' --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Watching E2E run $RUN_ID"
          gh run watch "$RUN_ID" -R k3ldon/Lro3-iOS --exit-status --interval 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
