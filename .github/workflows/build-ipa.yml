name: Compile iOS IPA (Unity GameCI + Xcode)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version'
        required: true
        default: '1.0.0'

jobs:
  export-xcode:
    name: Unity GameCI Export Xcode Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-template/Library
          key: Library-iOS-${{ hashFiles('unity-template/**') }}
          restore-keys: |
            Library-iOS-

      - name: Unity Builder (Export iOS Project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}        with:
          targetPlatform: iOS
          unityVersion: 2022.3.62f3
          projectPath: unity-template
          buildName: Lro3-Xcode
          buildsPath: build
          buildMethod: Ro3Ios.Editor.BuildIos.Build
          customParameters: -ro3Out /github/workspace/build/iOS/xcode -ro3Version ${{ github.event.inputs.version || '1.0.0' }}
          versioning: None
          allowDirtyBuild: true

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS/xcode/
          retention-days: 3

  build-ipa:
    name: Build IPA with Xcode
    needs: export-xcode
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Exported Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode/

      - name: Build Xcode Archive with Clang / LLVM
        run: |
          cd xcode
          mkdir -p Il2CppOutputProject/Source/il2cppOutput
          [ -f Il2CppOutputProject/Source/il2cppOutput/dummy.cpp ] || echo "// IL2CPP dummy" > Il2CppOutputProject/Source/il2cppOutput/dummy.cpp

          echo "== Creating PrivacyInfo.xcprivacy..."
          mkdir -p UnityFramework
          cat << 'EOF' > UnityFramework/PrivacyInfo.xcprivacy
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSPrivacyTracking</key>
              <false/>
              <key>NSPrivacyCollectedDataTypes</key>
              <array/>
              <key>NSPrivacyAccessedAPITypes</key>
              <array/>
          </dict>
          </plist>
          EOF
          cp UnityFramework/PrivacyInfo.xcprivacy .

          echo "== Compiling Unity-iPhone with xcodebuild..."
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath ../build/Lro3.xcarchive

      - name: Package Payload and IPA
        run: |
          echo "== Assembling IPA payload with Concept 1 UI..."
          mkdir -p Payload
          cp -r build/Lro3.xcarchive/Products/Applications/*.app Payload/
          APP_DIR=$(ls -d Payload/*.app | head -n 1)

          echo "== Compiling Concept 1 Cocoa Touch Launcher into $APP_DIR..."
          ISYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot $ISYSROOT -miphoneos-version-min=14.0 -fobjc-arc \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            -Wl,-rpath,@executable_path/Frameworks \
            native/launcher/main.m native/stubs/stubs_ios.c -o "$APP_DIR/LagnarokRO3"

          echo "== Injecting Launcher Assets (bg.jpg, logo-hero.png)..."
          mkdir -p "$APP_DIR/assets"
          cp native/launcher/assets/bg.jpg "$APP_DIR/assets/"
          cp native/launcher/assets/logo-hero.png "$APP_DIR/assets/"

          zip -r9 Lro3-iOS.ipa Payload/
          ls -lh Lro3-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lro3-iOS-IPA
          path: Lro3-iOS.ipa
          retention-days: 14
